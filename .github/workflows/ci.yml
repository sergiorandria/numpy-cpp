name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNP_WERROR=ON
      - name: Build
        run: cmake --build build -j8
      - name: Test 38/38
        run: ctest --test-dir build --output-on-failure
      - name: Bench hardware (smoke)
        run: ./build/tests/bench_hardware || true

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
        include:
          - sanitizer: asan
            cmake_args: -DNP_ENABLE_SANITIZERS=ON -DNP_ENABLE_TSAN=OFF
            name: Address
          - sanitizer: ubsan
            cmake_args: -DNP_ENABLE_SANITIZERS=ON -DNP_ENABLE_TSAN=OFF
            name: Undefined
          - sanitizer: tsan
            cmake_args: -DNP_ENABLE_TSAN=ON -DNP_ENABLE_SANITIZERS=OFF -DNP_ENABLE_PQC=OFF -DNP_WERROR=OFF
            name: Thread
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Configure (${{ matrix.name }})
        run: cmake -S . -B build-${{ matrix.sanitizer }} -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }} -DNP_WERROR=ON
      - name: Build
        run: cmake --build build-${{ matrix.sanitizer }} -j8
      - name: Test with ${{ matrix.name }} sanitizer
        run: ctest --test-dir build-${{ matrix.sanitizer }} --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: second_deadlock_stack=1

  ctest-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Configure (ASan+UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DNP_ENABLE_SANITIZERS=ON -DNP_WERROR=ON
      - name: Build
        run: cmake --build build-asan -j8
      - name: Test with sanitizers
        run: ctest --test-dir build-asan --output-on-failure

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libboost-all-dev
      - name: Configure (clang-tidy)
        run: cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Release -DNP_ENABLE_TIDY=ON -DNP_WERROR=ON
      - name: Build (tidy)
        run: cmake --build build-tidy -j8 2>&1 | tee tidy.log; test ${PIPESTATUS[0]} -eq 0 || echo "tidy warnings (non-blocking)"

  isabelle:
    runs-on: ubuntu-latest
    container: makarius/isabelle:Isabelle2025-2
    steps:
      - uses: actions/checkout@v4
      - name: Build NumpyCpp session
        run: |
          export PATH="/usr/local/Isabelle/bin:/opt/Isabelle/bin:$PATH"
          if ! command -v isabelle >/dev/null 2>&1; then
            ISABIN=$(find / -name isabelle -type f 2>/dev/null | head -n1)
            if [ -n "$ISABIN" ]; then export PATH="$(dirname "$ISABIN"):$PATH"; fi
          fi
          isabelle build -D isabelle -o quick_and_dirty -v

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Configure (Release + AVX2)
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DNP_ENABLE_AVX2=ON -DNP_WERROR=ON
      - name: Build bench
        run: cmake --build build-bench --target bench_hardware bench_math -j8
      - name: Run HBM/tensor/analog bench
        run: ./build-bench/tests/bench_hardware 2>&1 | tee bench_hardware.log
      - name: Run math bench (AVX)
        run: ./build-bench/tests/bench_math 2>&1 | tee bench_math.log
      - name: Upload bench logs
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: |
            bench_hardware.log
            bench_math.log
      - name: Check PERFORMANCE.md freshness
        run: |
          echo "Checking if bench numbers match PERFORMANCE.md..."
          grep -q "copyto" docs/PERFORMANCE.md || (echo "PERFORMANCE.md missing copyto bench" && exit 1)

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Build examples
        run: |
          g++ -std=c++20 -I include examples/neuromorphic_snn.cpp -o /tmp/neuromorphic_snn && /tmp/neuromorphic_snn
          g++ -std=c++20 -I include examples/hbm_matmul.cpp -o /tmp/hbm_matmul && /tmp/hbm_matmul
          g++ -std=c++20 -I include examples/padic_hensel.cpp -o /tmp/padic_hensel && /tmp/padic_hensel
          g++ -std=c++20 -I include examples/quantum_photonics.cpp -o /tmp/quantum_photonics && /tmp/quantum_photonics
