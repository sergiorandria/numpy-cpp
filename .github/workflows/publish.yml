name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist+wheel
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist python/
          ls -lh dist/
          # Also try manylinux wheel via cibuildwheel if available (best effort)
          pip install cibuildwheel || true
          cibuildwheel --output-dir dist python/ || echo "cibuildwheel skip (no Docker)"
          ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
